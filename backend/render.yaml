# Blueprint Render — PostgreSQL + disco para arquivos de boletos
# Monorepo: no painel Render, Root Directory = backend

databases:
  - name: sgi-postgres
    databaseName: sgi
    user: sgi
    plan: basic-256mb

services:
  - type: web
    name: sgi-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: sgi-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: sgi-postgres
          property: connectionString
      - key: SGI_BOLETOS_STORAGE_PATH
        value: /var/data/boletos-temp
      - key: SGI_DOCUMENTOS_STORAGE_PATH
        value: /var/data/documentos-clientes
      - key: SGI_LIVRO_CAIXA_STORAGE_PATH
        value: /var/data/livro-caixa-anexos
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: COBRANCA_EMAIL_ESCRITORIO
        sync: false
