# Perfil de produção (Render, VPS, etc.). Ative com SPRING_PROFILES_ACTIVE=prod
#
# Banco: PostgreSQL via DATABASE_URL (Render) — convertido automaticamente para JDBC.
# Arquivos (boletos PDF): disco persistente em /var/data (SGI_BOLETOS_STORAGE_PATH).

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

logging.level.root=INFO
logging.level.com.pucminas.sgi=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Segurança operacional
sgi.seed.enabled=false
sgi.auth.password-recovery-enabled=false
sgi.import.enabled=false

# Swagger fechado em produção
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
