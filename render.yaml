# Blueprint Render — PostgreSQL + disco para arquivos de boletos
# Frontend na Vercel: VITE_API_URL=https://<sgi-backend>.onrender.com

databases:
  - name: sgi-postgres
    databaseName: sgi
    user: sgi
    plan: basic-256mb

services:
  - type: web
    name: sgi-backend
    rootDir: backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: sgi-data
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: sgi-postgres
          property: connectionString
      - key: SGI_BOLETOS_STORAGE_PATH
        value: /var/data/boletos-temp
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
